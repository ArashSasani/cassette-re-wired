<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cassette re-wired</title>
</head>
<body>
  <h1>cassette re-wired</h1>

  <div class="cassette-illustration" aria-hidden="true">
    <svg viewBox="0 0 600 380" id="cassette-svg">
      <defs>
        <radialGradient id="reel" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#433a2e"/>
          <stop offset="40%" stop-color="#302820"/>
          <stop offset="100%" stop-color="#201a12"/>
        </radialGradient>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#302820"/>
          <stop offset="100%" stop-color="#201a12"/>
        </linearGradient>
      </defs>

      <rect x="20" y="60" width="560" height="260" rx="18" ry="18" fill="url(#body)" stroke="#564838" stroke-width="2"/>
      <rect x="40" y="80" width="520" height="220" rx="12" ry="12" fill="none" stroke="#403020" stroke-width="1"/>

      <!-- paper label sticker -->
      <g class="label-sticker">
        <rect x="118" y="92" width="364" height="86" rx="4" ry="4" fill="#150f09" stroke="#6a5638" stroke-width="1.5"/>
        <rect x="120" y="95" width="360" height="80" rx="6" ry="6" fill="#120f08" stroke="#564838" stroke-width="1.5"/>
        <text x="300" y="144" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="700" fill="#c8a96a" letter-spacing="4">CASSETTE RE-WIRED</text>
      </g>

      <!-- left reel -->
      <g class="reel" id="reel-left" style="transform-origin: 162px 235px;">
        <circle cx="162" cy="235" r="52" fill="url(#reel)" stroke="#564838" stroke-width="2"/>
        <circle cx="162" cy="235" r="38" fill="none" stroke="#403020" stroke-width="1"/>
        <circle cx="162" cy="235" r="24" id="reel-left-hub" fill="#120f08" stroke="#564838" stroke-width="1.5"/>
        <circle cx="162" cy="235" r="8" fill="#c8a96a"/>
        <line x1="162" y1="211" x2="162" y2="199" stroke="#564838" stroke-width="2"/>
        <line x1="183" y1="246" x2="193" y2="252" stroke="#564838" stroke-width="2"/>
        <line x1="141" y1="246" x2="131" y2="252" stroke="#564838" stroke-width="2"/>
      </g>

      <!-- right reel -->
      <g class="reel" id="reel-right" style="transform-origin: 438px 235px;">
        <circle cx="438" cy="235" r="52" fill="url(#reel)" stroke="#564838" stroke-width="2"/>
        <circle cx="438" cy="235" r="38" fill="none" stroke="#403020" stroke-width="1"/>
        <circle cx="438" cy="235" r="24" id="reel-right-hub" fill="#120f08" stroke="#564838" stroke-width="1.5"/>
        <circle cx="438" cy="235" r="8" fill="#c8a96a"/>
        <line x1="438" y1="211" x2="438" y2="199" stroke="#564838" stroke-width="2"/>
        <line x1="459" y1="246" x2="469" y2="252" stroke="#564838" stroke-width="2"/>
        <line x1="417" y1="246" x2="407" y2="252" stroke="#564838" stroke-width="2"/>
      </g>

      <path id="tape-path" d="M214 235 Q300 210 386 235" fill="none" stroke="#c8a96a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
      <circle cx="300" cy="232" r="5" fill="#564838"/>
      <ellipse cx="300" cy="320" rx="100" ry="8" fill="#564838" opacity="0.18"/>
    </svg>
  </div>

  <section id="upload-section">
    <h2>1. Source</h2>
    <form id="upload-form">
      <label class="upload-zone" id="upload-zone" for="source-file">
        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="upload-prompt">Drop an audio file here or <span class="upload-browse">browse</span></span>
        <span class="upload-filename" id="upload-filename">no file selected</span>
        <input type="file" id="source-file" accept="audio/*" required />
      </label>
      <button type="submit" id="upload-btn">Upload</button>
    </form>
    <p id="upload-status" class="muted"></p>
  </section>

  <section id="config-section" hidden>
    <h2>2. Options</h2>
    <div class="field-row">
      <label class="with-led">
        <span>Route</span>
        <div class="led-group">
          <select id="route" class="sr-select">
            <option value="A">A — denoise only</option>
            <option value="A-gen">A — denoise + generative upscale</option>
            <option value="B">B — DeepFilterNet pre-clean + denoise</option>
            <option value="B-gen">B — DeepFilterNet pre-clean + denoise + generative upscale</option>
          </select>
          <div class="segmented" data-for="route">
            <button type="button" data-value="A" title="Denoise only">A</button>
            <button type="button" data-value="A-gen" title="Denoise + generative upscale">A+gen</button>
            <button type="button" data-value="B" title="DeepFilterNet pre-clean + denoise">B</button>
            <button type="button" data-value="B-gen" title="DeepFilterNet pre-clean + denoise + generative upscale">B+gen</button>
          </div>
          <div class="led-indicator active" id="route-led"></div>
        </div>
      </label>
      <label class="with-led">
        <span>Device</span>
        <div class="led-group">
          <select id="device" class="sr-select">
            <option value="auto">auto</option>
            <option value="mps">mps</option>
            <option value="cpu">cpu</option>
          </select>
          <div class="segmented" data-for="device">
            <button type="button" data-value="auto">auto</button>
            <button type="button" data-value="mps">mps</button>
            <button type="button" data-value="cpu">cpu</button>
          </div>
          <div class="led-indicator active" id="device-led"></div>
        </div>
      </label>
    </div>
    <p class="muted route-description" id="route-description"></p>
    <p class="muted">Generative upscale always runs on CPU; all other stages use the selected device.</p>
    <div class="field-row" id="mains-row" hidden>
      <label class="with-led">
        <span>Mains hum</span>
        <div class="led-group">
          <select id="mains-hz" class="sr-select">
            <option value="60">60 Hz</option>
            <option value="50">50 Hz</option>
          </select>
          <div class="segmented" data-for="mains-hz">
            <button type="button" data-value="60">60 Hz</button>
            <button type="button" data-value="50">50 Hz</button>
          </div>
          <div class="led-indicator active" id="mains-led"></div>
        </div>
      </label>
    </div>
    <div class="field-row">
      <label>Sample offset (s)
        <input type="number" id="sample-offset" value="60" min="0" />
      </label>
      <label>Sample duration (s)
        <input type="number" id="sample-duration" value="180" min="1" />
      </label>
    </div>
    <div class="field-row button-row">
      <button id="run-sample">Run sample</button>
      <button id="run-full">Run full</button>
      <button id="cancel-run" class="danger" disabled>Cancel</button>
    </div>
    <p id="preflight-status" class="muted"></p>
  </section>

  <section id="progress-section" hidden>
    <h2>3. Progress</h2>
    <ul id="stage-list"></ul>
    <p id="timings" class="muted"></p>
  </section>

  <section id="playback-section" hidden>
    <h2>4. Before / after</h2>
    <div class="players">
      <div class="player">
        <div class="player-header">
          <span class="player-label">Before</span>
          <span class="player-time lcd" id="before-time">--:-- / --:--</span>
        </div>
        <audio id="before-audio"></audio>
        <div class="vu-meter" id="before-vu">
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
        </div>
        <div class="player-controls">
          <button class="player-playbtn" id="before-play" disabled aria-label="Play / pause before">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <input class="player-seek" id="before-seek" type="range" min="0" max="1" step="0.001" value="0" disabled />
          <a class="player-downloadbtn" id="before-download" aria-label="Download before" aria-disabled="true" download>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5v-2z"/></svg>
          </a>
        </div>
      </div>
      <div class="player">
        <div class="player-header">
          <span class="player-label">After</span>
          <span class="player-time lcd" id="after-time">--:-- / --:--</span>
        </div>
        <audio id="after-audio"></audio>
        <div class="vu-meter" id="after-vu">
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
          <span class="vu-bar"></span><span class="vu-bar"></span><span class="vu-bar"></span>
        </div>
        <div class="player-controls">
          <button class="player-playbtn" id="after-play" disabled aria-label="Play / pause after">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <input class="player-seek" id="after-seek" type="range" min="0" max="1" step="0.001" value="0" disabled />
          <a class="player-downloadbtn" id="after-download" aria-label="Download after" aria-disabled="true" download>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5v-2z"/></svg>
          </a>
        </div>
      </div>
    </div>
    <p id="export-status"></p>
  </section>

  <script type="module" src="./main.ts"></script>
</body>
</html>
